[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "otp-harbor"
version = "1.0.0"
description = "A small, security-focused, self-hosted TOTP service"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["totp", "2fa", "authenticator", "self-hosted", "fastapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "cryptography==50.0.1",
  "fastapi==0.141.1",
  "pillow==12.3.0",
  "pyotp==2.10.0",
  "sqlalchemy==2.0.54",
  "uvicorn==0.54.0",
  "zxing-cpp==3.1.1",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pip-audit==2.9.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
]

[project.scripts]
otp-harbor = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
