services:
  otp-harbor:
    build:
      context: .
      dockerfile: Dockerfile
    image: otp-harbor:1.0.0
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8787:8000"
    volumes:
      - otp-harbor-data:/data
      - type: bind
        source: ${OTP_HARBOR_MASTER_KEY_HOST_PATH:?set an absolute master-key path}
        target: /run/secrets/otp_harbor_master_key
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=0700,uid=10001,gid=10001,noexec,nosuid,nodev
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 15s

volumes:
  otp-harbor-data:
    name: otp-harbor-data
